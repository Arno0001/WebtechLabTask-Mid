<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1> Library Membership</h1>
<form id="memberForm">
<div>
<label for="fullname"> Fulllname: </label>
<input type="text" name="fullname" id="fullname" required>
</div>
<br>

<div>
<label for="age"> Age : </label>
<input type="number" name="age" id="age" required>
</div>
<br>

<div>
<label for="email"> Email: </label>
<input type="email" id="email" required>
</div>
<br>

<div>
<label for="phone"> Phone : </label>
<input type="number" name="phone" id="phone">
</div>
<br>

<div>
<label> Membership Package: </label>
<input type="radio" name="plan" value="Basic"> Basic
<input type="radio" name="plan" value="Silver"> Silver
<input type="radio" name="plan" value="Gold"> Gold
</div>
<br>

<div id="output"></div>
<br>

<div>
<input type="submit" value="Register">
<input type="reset" value="clear">
</div>

</form>

<script src="script.js"></script>
</body>
</html>
